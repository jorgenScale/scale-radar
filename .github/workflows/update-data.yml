name: Oppdater Scale Radar-data

on:
  schedule:
    - cron: "17 * * * *"        # hver time, 17 minutter over (UTC)
  workflow_dispatch:            # kan også kjøres manuelt fra Actions-fanen

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Hent data
        run: python scripts/fetch_data.py

      - name: Send e-postvarsler (kjører bare når SMTP-secrets er satt)
        if: env.SMTP_HOST != ''
        run: python scripts/notify.py

      - name: Commit hvis endret
        run: |
          git config user.name "scale-radar-bot"
          git config user.email "scale-radar-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Ingen endringer"
          else
            git commit -m "data: oppdatert $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
