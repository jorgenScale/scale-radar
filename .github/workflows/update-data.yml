name: Oppdater Scale Radar-data

on:
  schedule:
    - cron: "17 * * * *"        # hver time, 17 minutter over (UTC)
  workflow_dispatch:            # kan også kjøres manuelt fra Actions-fanen

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Hent data
        run: python scripts/fetch_data.py

      - name: Commit hvis endret
        run: |
          git config user.name "scale-radar-bot"
          git config user.email "scale-radar-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Ingen endringer"
          else
            git commit -m "data: oppdatert $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
